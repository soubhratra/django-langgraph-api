<!DOCTYPE html>
<html>
<head>
    <title>Teen Chatbot Client</title>
    <style>
        /* Import a fun Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

        body {
            background-color: #f0f8ff;
            font-family: 'Patrick Hand', cursive, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 600px;
            height: 80vh;
            border: 2px solid #ff75a0;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fff;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-message {
            background-color: #a0e7e5;
            align-self: flex-end;
            text-align: right;
            border-bottom-right-radius: 0;
        }

        .bot-message {
            background-color: #b4f8c8;
            align-self: flex-start;
            text-align: left;
            border-bottom-left-radius: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #input-container {
            display: flex;
            padding: 15px;
            background-color: #fce1e4;
            border-top: 2px solid #ff75a0;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        #message-input {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ff75a0;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s;
        }

        #message-input:focus {
            border-color: #ff5677;
        }

        #send-button {
            margin-left: 10px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #ff75a0;
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #send-button:hover {
            background-color: #ff5677;
        }

        ::placeholder {
            color: #999;
        }

        /* Scrollbar Styling */
        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #ff75a0;
            border-radius: 10px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: #ff5677;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Type your message here" autofocus autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        const chatHistory = [];

        // Function to add a message to the chat
        function addMessage(content, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `${sender}-message`);
            messageElement.textContent = content;
            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Function to send a message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message === '') return;

            // Add user message to chat history and display it
            chatHistory.push({ sender: 'user', content: message });
            addMessage(message, 'user');

            messageInput.value = '';
            messageInput.focus();

            // Send message to the server
            const evtSource = new EventSource('/api/chat?message=' + encodeURIComponent(message));
            let botMessage = '';
            let botMessageElement = null;

            evtSource.onmessage = function(e) {
                if (!botMessageElement) {
                    // Create a bot message element when the first token arrives
                    botMessageElement = document.createElement('div');
                    botMessageElement.classList.add('message', 'bot-message');
                    messagesContainer.appendChild(botMessageElement);
                }
                if (e.data === '[END]') {
                    // Add bot message to chat history and close the connection
                    chatHistory.push({ sender: 'bot', content: botMessage });
                    evtSource.close();
                } else {
                    // Append the token to the bot message
                    botMessage += e.data;
                    botMessageElement.textContent = botMessage;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            };

            evtSource.onerror = function() {
                if (botMessageElement) {
                    botMessageElement.textContent += '\n[Error: Unable to retrieve response]';
                }
                evtSource.close();
            };
        }

        // Event listener for the send button
        sendButton.addEventListener('click', sendMessage);

        // Event listener for the Enter key
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
                e.preventDefault(); // Prevent newline in the input
            }
        });
    </script>
</body>
</html>
